name: Frontend CI Pipeline

on:
  push:
    branches: [dev, main]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  validate:
    name: Build, Lint & Test
    runs-on: ubuntu-latest

    steps:
      # Step 1: Clone the repository onto the runner
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for SonarCloud analysis accuracy

      # Step 2: Install Node.js environment
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Step 3: Enable PNPM package manager
      - name: Setup PNPM
        uses: pnpm/action-setup@v3
        with:
          version: 9

      # Step 4: Resolve PNPM cache path for faster builds
      - name: Get PNPM Cache Directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      # Step 5: Restore cache to speed up dependency installation
      - name: Setup Cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      # Step 6: Install locked production & development packages
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # Step 7: Check code compliance using ESLint rules
      - name: Run Linter
        run: pnpm lint

      # Step 8: Compile TypeScript to verify types are correct
      - name: Compile TypeScript
        run: pnpm build

      # Step 9: Run Vitest with coverage report output
      - name: Run Unit Tests & Generate Coverage
        run: pnpm test:coverage

      # Step 10: Trigger static code analysis via SonarCloud
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
